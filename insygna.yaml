description: |
  State-driven AI interview simulator using LLM agents, retrieval-augmented context, and a policy-based interview engine to generate adaptive questions, evaluate answers in real time, and produce structured interview reports. A hybrid state–LLM interview simulation platform that conducts structured interviews using retrieval-augmented context, a deterministic interview controller and multiple AI agents. Unlike typical AI interview tools that rely purely on prompts, Cognix uses a state machine and policy engine to orchestrate LLM agents and maintain a stable interview flow. The system extracts evaluation topics from job descriptions, retrieves relevant resume evidence, generates adaptive questions, evaluates answers in real time, and produces a structured post-interview report with topic-wise performance analysis. Primary language: python; ships a container definition; observed outbound integrations: api.groq.com, api-inference.huggingface.co.
